name: Android checks
on:
  push:
    branches: [main, feat/creation-wizard]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile, test, lint, and compile UI tests
        run: bash gradlew assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest --console=plain
      - name: Preserve check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
